<!doctype html>
<html>
  <head></head>
  <body>
    <!--
      Netlify Forms detection file for the landlord lead form (see
      LandlordLeadForm.tsx). @netlify/plugin-nextjs v5 refuses to build if
      a Netlify form is rendered inside the Next.js app itself (its output
      isn't reliably static from the plugin's perspective) — this file is
      served as a plain static asset instead, per Netlify's migration
      guide: https://opennext.js.org/netlify/forms
      Nobody is meant to see this page; it exists only for Netlify's
      build-time bot to scan and for LandlordLeadForm to POST to.
    -->
    <form name="landlord-leads" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="landlord-leads" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="situation" />
      <input type="text" name="propertyDescription" />
      <input type="text" name="mobile" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
